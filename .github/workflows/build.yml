name: Build CHELA APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: |
          ls -R | head -40
          Z=$(find . -name "ChelaAI.zip" | head -1)
          if [ -n "$Z" ]; then mkdir -p /tmp/src && unzip -q "$Z" -d /tmp/src; D=/tmp/src; else D=.; fi
          P=$(dirname "$(find "$D" -name settings.gradle.kts | head -1)")
          cd "$P"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$(find . -name app-debug.apk | head -1)" "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: CHELA-APK
          path: out/app-debug.apk
